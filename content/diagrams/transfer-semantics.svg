<svg height="310.333px" width="588.0px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="360" y="28" text-anchor="middle" font-size="14" fill="#64748b" letter-spacing="2">POSITION TRANSFER SEMANTICS</text>

  <!-- LEFT: supply position (push) -->
  <g transform="translate(40,60)">
    <text x="140" y="0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Supply position · push</text>
    <text x="140" y="18" text-anchor="middle" font-size="11" fill="#64748b">standard ERC20</text>

    <!-- sender -->
    <rect x="20" y="50" width="100" height="60" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="70" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Sender</text>
    <text x="70" y="94" text-anchor="middle" font-size="10" fill="#64748b">caller</text>

    <!-- receiver -->
    <rect x="160" y="50" width="100" height="60" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="210" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Receiver</text>
    <text x="210" y="94" text-anchor="middle" font-size="10" fill="#64748b">benefits</text>

    <!-- arrow push -->
    <g stroke="#16a34a" stroke-width="2" fill="none">
      <path d="M 120 80 L 156 80"/>
    </g>
    <polygon points="156,76 164,80 156,84" fill="#16a34a"/>
    <text x="140" y="68" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="600">push</text>

    <!-- health check -->
    <rect x="20" y="140" width="240" height="40" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="140" y="158" text-anchor="middle" font-size="11" fill="#78350f" font-weight="600">Health check on sender</text>
    <text x="140" y="172" text-anchor="middle" font-size="10" fill="#92400e">"can you afford to give this away?"</text>

    <text x="140" y="220" text-anchor="middle" font-size="11" fill="#475569">Value moves from caller to receiver.</text>
    <text x="140" y="236" text-anchor="middle" font-size="11" fill="#475569">Receiver consents implicitly by accepting.</text>
  </g>

  <!-- RIGHT: borrow position (pull) -->
  <g transform="translate(400,60)">
    <text x="140" y="0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Borrow position · pull</text>
    <text x="140" y="18" text-anchor="middle" font-size="11" fill="#64748b">inverted ERC20</text>

    <!-- source -->
    <rect x="20" y="50" width="100" height="60" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="70" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Source</text>
    <text x="70" y="94" text-anchor="middle" font-size="10" fill="#64748b">debt holder</text>

    <!-- caller -->
    <rect x="160" y="50" width="100" height="60" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="210" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Caller</text>
    <text x="210" y="94" text-anchor="middle" font-size="10" fill="#64748b">assumes debt</text>

    <!-- arrow pull -->
    <g stroke="#dc2626" stroke-width="2" fill="none">
      <path d="M 124 80 L 158 80"/>
    </g>
    <polygon points="124,76 116,80 124,84" fill="#dc2626"/>
    <text x="140" y="68" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">pull</text>

    <!-- health check -->
    <rect x="20" y="140" width="240" height="40" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="140" y="158" text-anchor="middle" font-size="11" fill="#78350f" font-weight="600">Health check on caller</text>
    <text x="140" y="172" text-anchor="middle" font-size="10" fill="#92400e">"can you afford to take this on?"</text>

    <text x="140" y="220" text-anchor="middle" font-size="11" fill="#475569">Both parties must approve.</text>
    <text x="140" y="236" text-anchor="middle" font-size="11" fill="#475569">Source benefits by losing the debt.</text>
  </g>

  <!-- Footer -->
  <text x="360" y="340" text-anchor="middle" font-size="11" fill="#64748b">
    With debt, the receiver suffers and the source benefits — so the semantics invert.
  </text>
  <text x="360" y="356" text-anchor="middle" font-size="11" fill="#64748b">
    Pool can bypass approvals during liquidation to enable debt assumption.
  </text>
</svg>
