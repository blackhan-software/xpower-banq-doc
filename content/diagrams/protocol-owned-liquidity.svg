<svg height="294.0px" width="588.0px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="360" y="28" text-anchor="middle" font-size="14" fill="#64748b" letter-spacing="2">PROTOCOL-OWNED LIQUIDITY</text>

  <!-- Borrow position -->
  <g transform="translate(40,60)">
    <rect width="150" height="110" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="75" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">Borrow side</text>
    <line x1="15" y1="32" x2="135" y2="32" stroke="#fecaca"/>
    <text x="15" y="52" font-size="11" fill="#475569">charged R(U)×(1+s)</text>
    <text x="15" y="70" font-size="11" fill="#475569">zero-spread projection</text>
    <text x="15" y="88" font-size="10" fill="#94a3b8">surplus = debt growth gap</text>
  </g>

  <!-- arrow -->
  <g transform="translate(205,115)">
    <path d="M 0 0 L 55 0" stroke="#0f172a" stroke-width="2" fill="none"/>
    <polygon points="55,-5 65,0 55,5" fill="#0f172a"/>
    <text x="32" y="-12" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">accrue</text>
  </g>

  <!-- Supply position -->
  <g transform="translate(280,60)">
    <rect width="150" height="110" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="75" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">Supply side</text>
    <line x1="15" y1="32" x2="135" y2="32" stroke="#bbf7d0"/>
    <text x="15" y="52" font-size="11" fill="#475569">credited U·R(U)×(1−s)</text>
    <text x="15" y="70" font-size="11" fill="#475569">zero-spread projection</text>
    <text x="15" y="88" font-size="10" fill="#94a3b8">surplus = yield gap</text>
  </g>

  <!-- arrows into vault -->
  <g transform="translate(145,230)">
    <path d="M 0 0 L 90 -40" stroke="#0f172a" stroke-width="1.5" fill="none"/>
    <polygon points="100,-46 93,-37 90,-48" fill="#0f172a"/>
    <text x="28" y="14" text-anchor="middle" font-size="10" fill="#64748b">polAccrued()</text>
  </g>
  <g transform="translate(430,230)">
    <path d="M 0 0 L -90 -40" stroke="#0f172a" stroke-width="1.5" fill="none"/>
    <polygon points="-100,-46 -93,-37 -90,-48" fill="#0f172a"/>
    <text x="0" y="14" text-anchor="middle" font-size="10" fill="#64748b">polAccrued()</text>
  </g>

  <!-- Vault -->
  <g transform="translate(285,60)">
    <rect x="-75" y="120" width="150" height="60" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="0" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Vault</text>
    <line x1="-60" y1="150" x2="60" y2="150" stroke="#cbd5e1"/>
    <text x="0" y="168" text-anchor="middle" font-size="11" fill="#475569">pol() = supply + borrow surplus</text>
  </g>

  <!-- Governance / Pols -->
  <g transform="translate(480,200)">
    <rect width="170" height="100" rx="8" fill="#fdf4ff" stroke="#e9d5ff"/>
    <text x="85" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">Pols / fetchPol</text>
    <line x1="15" y1="32" x2="155" y2="32" stroke="#e9d5ff"/>
    <text x="15" y="52" font-size="11" fill="#475569">governance-gated</text>
    <text x="15" y="70" font-size="11" fill="#475569">share-capped (default 0)</text>
    <text x="15" y="88" font-size="10" fill="#94a3b8">→ treasury / burn</text>
  </g>

  <!-- arrow from vault to pols -->
  <g transform="translate(390,150)">
    <path d="M 0 40 L 75 40" stroke="#0f172a" stroke-width="1.5" fill="none"/>
    <polygon points="85,40 76,35 76,45" fill="#0f172a"/>
    <text x="42" y="34" text-anchor="middle" font-size="10" fill="#64748b">fetch</text>
  </g>

  <!-- Comparison panel -->
  <g transform="translate(40,310)">
    <rect width="640" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="26" font-size="11" fill="#475569">
      The spread gap was previously <tspan font-weight="600" fill="#0f172a">invisible</tspan> over-collateralisation;
      POL tracks it and lets governance extract it under a lethargic share cap.
    </text>
  </g>
</svg>
