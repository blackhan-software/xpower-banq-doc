<svg height="163.333px" width="588.0px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="360" y="24" text-anchor="middle" font-size="13" fill="#64748b" letter-spacing="2">QUICKSTART FLOW</text>

  <g>
    <!-- 1 Connect -->
    <g transform="translate(21,50)">
      <rect width="110" height="110" rx="8" fill="#fff" stroke="#cbd5e1"/>
      <circle cx="20" cy="20" r="13" fill="#0f172a"/>
      <text x="20" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
      <text x="55" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Connect</text>
      <text x="55" y="80" text-anchor="middle" font-size="10" fill="#64748b">wallet to app</text>
      <text x="55" y="94" text-anchor="middle" font-size="10" fill="#64748b">approve chain</text>
    </g>
    <path d="M 136 105 L 158 105" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <polygon points="158,101 166,105 158,109" fill="#94a3b8"/>

    <!-- 2 Approve -->
    <g transform="translate(163,50)">
      <rect width="110" height="110" rx="8" fill="#fff" stroke="#cbd5e1"/>
      <circle cx="20" cy="20" r="13" fill="#0f172a"/>
      <text x="20" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
      <text x="55" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Approve</text>
      <text x="55" y="80" text-anchor="middle" font-size="10" fill="#64748b">ERC20 allowance</text>
      <text x="55" y="94" text-anchor="middle" font-size="10" fill="#64748b">for the pool</text>
    </g>
    <path d="M 278 105 L 300 105" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <polygon points="300,101 308,105 300,109" fill="#94a3b8"/>

    <!-- 3 Supply -->
    <g transform="translate(305,50)">
      <rect width="110" height="110" rx="8" fill="#fff" stroke="#cbd5e1"/>
      <circle cx="20" cy="20" r="13" fill="#0f172a"/>
      <text x="20" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
      <text x="55" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Supply</text>
      <text x="55" y="80" text-anchor="middle" font-size="10" fill="#64748b">deposit collateral</text>
      <text x="55" y="94" text-anchor="middle" font-size="10" fill="#64748b">earn supply rate</text>
    </g>
    <path d="M 420 105 L 442 105" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <polygon points="442,101 450,105 442,109" fill="#94a3b8"/>

    <!-- 4 Borrow -->
    <g transform="translate(447,50)">
      <rect width="110" height="110" rx="8" fill="#fff" stroke="#cbd5e1"/>
      <circle cx="20" cy="20" r="13" fill="#0f172a"/>
      <text x="20" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
      <text x="55" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Borrow</text>
      <text x="55" y="80" text-anchor="middle" font-size="10" fill="#64748b">up to 66.67% LTV</text>
      <text x="55" y="94" text-anchor="middle" font-size="10" fill="#64748b">pay borrow rate</text>
    </g>
    <path d="M 562 105 L 584 105" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <polygon points="584,101 592,105 584,109" fill="#94a3b8"/>

    <!-- 5 Settle + Redeem -->
    <g transform="translate(589,50)">
      <rect width="110" height="110" rx="8" fill="#fff" stroke="#cbd5e1"/>
      <circle cx="20" cy="20" r="13" fill="#0f172a"/>
      <text x="20" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
      <text x="55" y="58" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Settle + Redeem</text>
      <text x="55" y="80" text-anchor="middle" font-size="10" fill="#64748b">repay the debt</text>
      <text x="55" y="94" text-anchor="middle" font-size="10" fill="#64748b">withdraw supply</text>
    </g>
  </g>

  <text x="360" y="186" text-anchor="middle" font-size="11" fill="#64748b">Five steps from wallet connection to a closed-out position.</text>
</svg>
