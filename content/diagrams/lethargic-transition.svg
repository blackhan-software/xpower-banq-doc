<svg height="294.0px" width="588.0px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="360" y="28" text-anchor="middle" font-size="14" fill="#0f172a" letter-spacing="2">LETHARGIC PARAMETER TRANSITION</text>

  <!-- axes -->
  <g transform="translate(80,60)" stroke="#475569" stroke-width="1" fill="none">
    <line x1="0" y1="220" x2="560" y2="220"/>
    <line x1="0" y1="0" x2="0" y2="220"/>
  </g>

  <!-- gridlines -->
  <g transform="translate(80,60)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 4">
    <line x1="0" y1="40" x2="560" y2="40"/>
    <line x1="0" y1="180" x2="560" y2="180"/>
  </g>

  <!-- labels for old/new value -->
  <g transform="translate(80,60)" font-size="11" fill="#0f172a">
    <text x="-10" y="44" text-anchor="end">θ₁ (target)</text>
    <text x="-10" y="184" text-anchor="end">θ₀ (old)</text>
    <text x="-10" y="234" text-anchor="end" fill="#475569">t₀</text>
    <text x="160" y="234" text-anchor="middle" fill="#475569">tₛ</text>
    <text x="565" y="234" fill="#475569">→ time</text>
  </g>

  <!-- step (instant) for comparison -->
  <g transform="translate(80,60)" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="4 4">
    <path d="M 0 180 L 160 180 L 160 40 L 560 40"/>
  </g>
  <g transform="translate(80,60)">
    <text x="380" y="35" font-size="10" fill="#475569">instant change (incumbents)</text>
  </g>

  <!-- asymptotic (lethargic) curve: from t_s onward, time-weighted mean approaches target -->
  <g transform="translate(80,60)" stroke="#3b82f6" stroke-width="2.5" fill="none">
    <!-- Pre-change flat at theta0 -->
    <path d="M 0 180 L 160 180"/>
    <!-- Asymptotic decay: y = 40 + 140*exp(-(x-160)/120) -->
    <path d="M 160 180
             C 200 130, 240 95, 320 70
             S 460 46, 560 42"/>
  </g>

  <!-- markers -->
  <g transform="translate(80,60)" fill="#3b82f6">
    <circle cx="160" cy="180" r="3.5"/>
    <circle cx="560" cy="42" r="3.5"/>
  </g>

  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#475569">
    <tspan fill="#3b82f6" font-weight="600">Lethargic transition:</tspan> 0.5× ≤ θ₁/θ₀ ≤ 2× per cycle, asymptotically approached
  </text>
  <text x="360" y="338" text-anchor="middle" font-size="11" fill="#0f172a">
    A 10× change requires ~4 cycles. Users always have time to adjust.
  </text>
</svg>
