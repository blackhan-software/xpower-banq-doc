<svg height="343.0px" width="588.0px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="poolGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="14" fill="#64748b" letter-spacing="2">CONTRACT ARCHITECTURE</text>

  <!-- Pool (center, primary) -->
  <g filter="url(#soft)">
    <rect x="280" y="170" width="160" height="80" rx="8" fill="url(#poolGrad)"/>
    <text x="360" y="205" text-anchor="middle" font-size="18" font-weight="600" fill="#f8fafc">Pool</text>
    <text x="360" y="225" text-anchor="middle" font-size="11" fill="#cbd5e1">supply · borrow · liquidate</text>
  </g>

  <!-- Acma (top-left) -->
  <g filter="url(#soft)">
    <rect x="80" y="80" width="140" height="64" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="150" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Acma</text>
    <text x="150" y="126" text-anchor="middle" font-size="10" fill="#64748b">access control</text>
  </g>

  <!-- Oracle (top-right) -->
  <g filter="url(#soft)">
    <rect x="500" y="80" width="140" height="64" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="570" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Oracle</text>
    <text x="570" y="126" text-anchor="middle" font-size="10" fill="#64748b">log-space TWAP</text>
  </g>

  <!-- Supply Position (left) -->
  <g filter="url(#soft)">
    <rect x="40" y="200" width="160" height="64" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="120" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Supply Position</text>
    <text x="120" y="246" text-anchor="middle" font-size="10" fill="#64748b">ERC20 · push semantics</text>
  </g>

  <!-- Borrow Position (right) -->
  <g filter="url(#soft)">
    <rect x="520" y="200" width="160" height="64" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="600" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Borrow Position</text>
    <text x="600" y="246" text-anchor="middle" font-size="10" fill="#64748b">ERC20 · pull semantics</text>
  </g>

  <!-- Vault (bottom-center) -->
  <g filter="url(#soft)">
    <rect x="280" y="320" width="160" height="64" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="360" y="348" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Vault</text>
    <text x="360" y="366" text-anchor="middle" font-size="10" fill="#64748b">ERC4626 custody</text>
  </g>

  <!-- Connections -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <line x1="220" y1="120" x2="280" y2="180"/>
    <line x1="500" y1="120" x2="440" y2="180"/>
    <line x1="200" y1="232" x2="280" y2="220"/>
    <line x1="520" y1="232" x2="440" y2="220"/>
    <line x1="360" y1="250" x2="360" y2="320"/>
  </g>

  <!-- Caption -->
  <text x="360" y="402" text-anchor="middle" font-size="11" fill="#64748b">
    Pool orchestrates · Acma gates · Oracle prices · Vault custodies · Positions are tradeable ERC20s
  </text>
</svg>
