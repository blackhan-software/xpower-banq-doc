<svg height="261.333px" width="588.0px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="360" y="28" text-anchor="middle" font-size="14" fill="#64748b" letter-spacing="2">HEALTH FACTOR</text>

  <!-- semicircle gauge -->
  <g transform="translate(360,200)">
    <!-- bg arc segments: red/yellow/green -->
    <path d="M -180 0 A 180 180 0 0 1 -126.5 -127.3" stroke="#dc2626" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M -120 -134 A 180 180 0 0 1 0 -180" stroke="#f59e0b" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M 6 -180 A 180 180 0 0 1 180 0" stroke="#16a34a" stroke-width="22" fill="none" stroke-linecap="round"/>

    <!-- tick marks at 0, 1, 2, 3 -->
    <g stroke="#475569" stroke-width="1.5">
      <line x1="-180" y1="0" x2="-160" y2="0"/>
      <line x1="-127" y1="-127" x2="-113" y2="-113"/>
      <line x1="0" y1="-180" x2="0" y2="-160"/>
      <line x1="127" y1="-127" x2="113" y2="-113"/>
      <line x1="180" y1="0" x2="160" y2="0"/>
    </g>
    <text x="-198" y="6" text-anchor="end" font-size="13" fill="#0f172a" font-weight="600">0</text>
    <text x="-138" y="-138" text-anchor="end" font-size="13" fill="#0f172a" font-weight="600">100%</text>
    <text x="0" y="-188" text-anchor="middle" font-size="13" fill="#0f172a" font-weight="600">150%</text>
    <text x="138" y="-138" font-size="13" fill="#0f172a" font-weight="600">200%</text>
    <text x="198" y="6" font-size="13" fill="#0f172a" font-weight="600">300%+</text>

    <!-- needle pointing at H≈150% (top) -->
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#0f172a" stroke-width="3"/>
    <circle r="8" fill="#0f172a"/>
    <circle r="3" fill="#fff"/>

    <!-- center labels -->
    <text x="0" y="40" text-anchor="middle" font-size="14" fill="#64748b">your H</text>
  </g>

  <!-- legend -->
  <g transform="translate(80,260)" font-size="12" fill="#475569">
    <rect width="14" height="14" rx="2" fill="#dc2626"/>
    <text x="22" y="11">H &lt; 100% · liquidatable</text>

    <rect x="200" width="14" height="14" rx="2" fill="#f59e0b"/>
    <text x="222" y="11">H &lt; 120% · danger zone</text>

    <rect x="420" width="14" height="14" rx="2" fill="#16a34a"/>
    <text x="442" y="11">H ≥ 120% · healthy</text>
  </g>
</svg>
