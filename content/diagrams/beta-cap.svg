<svg height="294.0px" width="588.0px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="360" y="28" text-anchor="middle" font-size="14" fill="#0f172a" letter-spacing="2">BETA-DISTRIBUTED POSITION CAP</text>

  <!-- plot area -->
  <g transform="translate(120,60)">
    <!-- axes -->
    <line x1="0" y1="220" x2="480" y2="220" stroke="#475569"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#475569"/>

    <!-- gridlines -->
    <g stroke="#94a3b8" stroke-dasharray="2 4">
      <line x1="160" y1="0" x2="160" y2="220"/>
      <line x1="240" y1="0" x2="240" y2="220"/>
      <line x1="0" y1="60" x2="480" y2="60"/>
    </g>

    <!-- curve: 12 * lambda * (1 - lambda)^2, peak at λ=1/3 -->
    <!-- at λ=0: 0; λ=1/3: 12 * (1/3) * (4/9) = 16/9 ≈ 1.78; λ=1: 0 -->
    <!-- map λ ∈ [0,1] -> x ∈ [0,480]; map y ∈ [0, 1.78] -> y ∈ [220, 30] (height ~190) -->
    <path d="M 0 220
             C 30 80, 80 35, 160 30
             C 220 30, 280 90, 360 160
             C 410 195, 450 215, 480 220"
          fill="none" stroke="#3b82f6" stroke-width="2.5"/>

    <!-- peak marker at λ = 1/3 -->
    <line x1="160" y1="30" x2="160" y2="220" stroke="#475569" stroke-dasharray="3 3"/>
    <circle cx="160" cy="30" r="4" fill="#3b82f6"/>
    <text x="160" y="20" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="600">peak at λ = 1/3</text>

    <!-- axis labels -->
    <text x="0" y="240" text-anchor="middle" font-size="11" fill="#0f172a">0</text>
    <text x="160" y="240" text-anchor="middle" font-size="11" fill="#0f172a">1/3</text>
    <text x="240" y="240" text-anchor="middle" font-size="11" fill="#0f172a">1/2</text>
    <text x="480" y="240" text-anchor="middle" font-size="11" fill="#0f172a">1</text>
    <text x="240" y="260" text-anchor="middle" font-size="11" fill="#0f172a">λ = your balance / total supply</text>

    <text x="-12" y="225" text-anchor="end" font-size="11" fill="#0f172a">0</text>
    <text x="-12" y="33" text-anchor="end" font-size="11" fill="#0f172a">max</text>
    <text x="-50" y="115" text-anchor="middle" font-size="11" fill="#0f172a" transform="rotate(-90,-50,115)">cap multiplier</text>

    <!-- annotations -->
    <text x="40" y="180" font-size="10" fill="#475569">small holders</text>
    <text x="40" y="194" font-size="10" fill="#475569">enter quickly</text>

    <text x="380" y="180" font-size="10" fill="#475569" text-anchor="middle">large holders</text>
    <text x="380" y="194" font-size="10" fill="#475569" text-anchor="middle">slow to dominate</text>
  </g>

  <text x="360" y="320" text-anchor="middle" font-size="11" fill="#0f172a">
    cap(B, S, n) = C_max · 12λ(1−λ)² / √(n+2) · vanishes at both extremes
  </text>
  <text x="360" y="336" text-anchor="middle" font-size="11" fill="#0f172a">
    The √(n+2) divisor rate-limits Sybil capacity gain; it does not prevent it.
  </text>
</svg>
