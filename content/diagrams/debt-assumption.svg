<svg height="294.0px" width="588.0px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="360" y="28" text-anchor="middle" font-size="14" fill="#64748b" letter-spacing="2">DEBT ASSUMPTION LIQUIDATION</text>

  <!-- Victim -->
  <g transform="translate(40,80)">
    <rect width="160" height="120" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="80" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Victim · H &lt; 1</text>
    <line x1="20" y1="36" x2="140" y2="36" stroke="#fecaca"/>
    <text x="20" y="58" font-size="11" fill="#475569">supply: 1500</text>
    <text x="20" y="78" font-size="11" fill="#475569">borrow: 1100</text>
    <text x="20" y="100" font-size="10" fill="#94a3b8">underwater on a price drop</text>
  </g>

  <!-- arrow -->
  <g transform="translate(220,140)">
    <path d="M 0 0 L 80 0" stroke="#0f172a" stroke-width="2" fill="none"/>
    <polygon points="80,-5 90,0 80,5" fill="#0f172a"/>
    <text x="45" y="-12" text-anchor="middle" font-size="11" fill="#0f172a" font-weight="600">2⁻ᵉ slice</text>
    <text x="45" y="20" text-anchor="middle" font-size="10" fill="#64748b">e.g. e=1 → 50%</text>
  </g>

  <!-- Liquidator -->
  <g transform="translate(330,80)">
    <rect width="160" height="120" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="80" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Liquidator</text>
    <line x1="20" y1="36" x2="140" y2="36" stroke="#bbf7d0"/>
    <text x="20" y="58" font-size="11" fill="#475569">+750 supply</text>
    <text x="20" y="78" font-size="11" fill="#475569">+550 debt</text>
    <text x="20" y="100" font-size="10" fill="#94a3b8">profit: 200 collateral</text>
  </g>

  <!-- arrow -->
  <g transform="translate(510,140)">
    <path d="M 0 0 L 50 0" stroke="#0f172a" stroke-width="2" fill="none"/>
    <polygon points="50,-5 60,0 50,5" fill="#0f172a"/>
  </g>

  <!-- Pool checks H -->
  <g transform="translate(580,80)">
    <rect width="100" height="120" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="50" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Pool</text>
    <line x1="10" y1="36" x2="90" y2="36" stroke="#cbd5e1"/>
    <text x="50" y="60" text-anchor="middle" font-size="11" fill="#475569">verify</text>
    <text x="50" y="76" text-anchor="middle" font-size="11" fill="#475569">liquidator's</text>
    <text x="50" y="92" text-anchor="middle" font-size="11" fill="#475569">post-H ≥ 100%</text>
  </g>

  <!-- Comparison panel -->
  <g transform="translate(40,250)">
    <rect width="640" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="22" font-size="12" font-weight="600" fill="#0f172a">vs. traditional repayment liquidation</text>
    <text x="20" y="44" font-size="11" fill="#475569">
      Compound/Aave/Euler: liquidator pays the debt in cash, receives discounted collateral.
    </text>
    <text x="20" y="60" font-size="11" fill="#475569">
      XPower Banq: liquidator <tspan font-weight="600" fill="#0f172a">assumes the debt</tspan>; only needs collateral headroom, not liquid capital.
    </text>
  </g>
</svg>
